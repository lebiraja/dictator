name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: service/dev-requirements.txt
      - name: Install dev dependencies
        run: pip install -r service/dev-requirements.txt
      - name: Lint
        run: ruff check service/
      - name: Test
        run: pytest service/tests/ -q

  shell-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          bash -n install.sh scripts/*.sh
          sh -n cli/dictator cli/dictator-setup
      - name: Compile GSettings schema
        run: glib-compile-schemas --strict extension/schemas/
